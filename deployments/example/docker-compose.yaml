services:
  deployment-agent:
    image: sohail342/deployment-agent:v1.0.0
    container_name: deployment-agent
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deployment-agent-state:/var/lib/deployment-agent
    command: ["--state-dir", "/var/lib/deployment-agent", "--name", "deployment-agent"]

volumes:
  deployment-agent-state:
